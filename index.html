<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Cannon Catch Brainrot</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="alt" class="outline">
        <div><span id="altNum">0</span><span class="unit">m</span></div>
        <div id="zone">Low Sky</div>
        <div id="best"></div>
      </div>
      <div id="stack"></div>
      <div id="corner">
        <button id="soundBtn" type="button">Sound on</button>
        <button id="tuneBtn" type="button">Tune</button>
      </div>
      <div id="prompt" class="outline"></div>
      <div id="toasts"></div>
      <div id="charge">
        <div class="track"><div class="band green"></div><div class="band perfect"></div></div>
        <div class="needle"></div>
      </div>
      <div id="groundBar">
        <div class="track"><div class="zone crash"></div><div class="zone perfect"></div></div>
        <div class="marker"></div>
        <div class="label outline">GROUND</div>
      </div>
      <button id="chuteBtn" type="button">PARA<br />CHUTE<span class="key">Space</span></button>
      <div id="flightNo" class="outline"></div>
    </div>

    <div id="reveal" class="hidden">
      <div class="panel">
        <h2 id="revealTitle"></h2>
        <div id="cards"></div>
        <p id="summary"></p>
        <button id="againBtn" type="button">Fire again!</button>
        <div class="hint">or press Space</div>
      </div>
    </div>

    <div id="tune" class="hidden">
      <h3>Tuning</h3>
      <label>Cannon level <b id="levelVal"></b><input id="levelIn" type="range" min="1" max="60" step="1" /></label>
      <div id="heightVal" class="sub"></div>
      <label>Carry limit <b id="carryVal"></b><input id="carryIn" type="range" min="3" max="15" step="1" /></label>
      <label>Hazards
        <select id="hazIn">
          <option value="auto">From flight 3 (tutorial)</option>
          <option value="on">Always</option>
          <option value="off">Off</option>
        </select>
      </label>
      <button id="resetBtn" type="button">Reset tutorial and best height</button>
      <p class="sub">T toggles this panel. M mutes.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
